name: PicoFox
configs:
  Debug: debug
  Release: release
  AppStore: release
options:
  bundleIdPrefix: app.picofox
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  PicoFoxCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0.9'
    CURRENT_PROJECT_VERSION: 11
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: FoxProgrammer
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio to create a WAV for your PicoFox.
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  PicoFox:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PicoFoxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.picofox.studio
        PRODUCT_NAME: FoxProgrammer
        PRODUCT_MODULE_NAME: PicoFox
        TARGETED_DEVICE_FAMILY: '1,2'
  PicoFoxMac:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: PicoFoxCore
    entitlements:
      path: App/PicoFoxMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.microphone: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.picofox.studio.mac
        PRODUCT_NAME: FoxProgrammer
        PRODUCT_MODULE_NAME: PicoFoxMac
      configs:
        AppStore:
          PRODUCT_BUNDLE_IDENTIFIER: app.picofox.studio
  PicoFoxMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppleTests, Tests/PicoFoxCoreTests]
    dependencies:
      - target: PicoFoxMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.picofox.studio.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FoxProgrammer.app/Contents/MacOS/FoxProgrammer"
schemes:
  PicoFox:
    build:
      targets:
        PicoFox: all
  PicoFoxMac:
    build:
      targets:
        PicoFoxMac: all
    test:
      targets:
        - PicoFoxMacTests
  PicoFoxMacStore:
    build:
      targets:
        PicoFoxMac: all
    run:
      config: AppStore
    archive:
      config: AppStore
